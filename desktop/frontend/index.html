<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>koine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#121214; --panel:#1a1a1e; --line:#2a2a30; --fg:#e6e6ea; --dim:#8b8b95; --accent:#7aa2f7; --bad:#f7768e; --tool:#73daca; }
  @media (prefers-color-scheme: light) { :root { --bg:#fafafa; --panel:#f0f0f3; --line:#dcdce2; --fg:#1b1b1f; --dim:#6b6b75; --accent:#2f5bd0; --bad:#c4284a; --tool:#0f7d6b; } }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:grid; grid-template-columns: 240px 1fr; background:var(--bg); color:var(--fg); font:14px/1.5 ui-sans-serif, system-ui, sans-serif; }
  aside { background:var(--panel); border-right:1px solid var(--line); padding:16px; overflow:auto; }
  aside h1 { font-size:15px; margin:0 0 4px; } aside small { color:var(--dim); word-break:break-all; }
  aside h2 { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:18px 0 6px; }
  aside li { list-style:none; padding:2px 0; font-family:ui-monospace, monospace; font-size:12.5px; cursor:default; }
  aside ul { margin:0; padding:0; } aside li.cmd { cursor:pointer; color:var(--accent); }
  main { display:grid; grid-template-rows: 1fr auto; min-width:0; }
  #log { overflow:auto; padding:20px 24px; display:flex; flex-direction:column; gap:10px; }
  .msg { white-space:pre-wrap; max-width:80ch; } .user { color:var(--accent); font-weight:600; }
  .tool { font-family:ui-monospace, monospace; font-size:12.5px; color:var(--tool); }
  .res { font-family:ui-monospace, monospace; font-size:12px; color:var(--dim); margin-left:14px; max-height:6.5em; overflow:hidden; white-space:pre-wrap; }
  .res.err, .err { color:var(--bad); } .notice { color:var(--dim); font-style:italic; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--panel); }
  textarea { flex:1; resize:none; height:56px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; }
  textarea:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:0 18px; font:inherit; cursor:pointer; }
  button.stop { background:var(--bad); } .dialog button { margin:4px 6px 0 0; padding:4px 12px; } .dialog input { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 8px; } button:disabled { opacity:.5; }
</style>
</head>
<body>
<aside>
  <h1>koine</h1><small id="cwd"></small>
  <h2>Commands</h2><ul id="commands"></ul>
  <h2>Status</h2><ul id="status"></ul>
</aside>
<main>
  <div id="log" aria-live="polite"></div>
  <form id="f">
    <textarea id="t" placeholder="Message koine — Enter to send, Shift+Enter for newline" autofocus></textarea>
    <button id="go" type="submit">Send</button>
  </form>
</main>
<script type="module">
import { Call, Events } from "/wails/runtime.js";
// The Go side (desktop/bridge) keeps the transcript; this page draws the entries it is sent, by index.
const $ = (id) => document.getElementById(id);
const log = $("log"), t = $("t"), go = $("go");
// Service methods are called by name (package.type.method); nothing is generated.
const api = new Proxy({}, { get: (_, m) => (...args) => Call.ByName("main.Service." + m, ...args) });
let busy = false, dialog = null;
const nodes = [];

function setBusy(b) { busy = b; go.textContent = b ? "Stop" : "Send"; go.className = b ? "stop" : ""; }

function draw(i, e) {
  let d = nodes[i];
  if (!d) { d = nodes[i] = document.createElement("div"); log.appendChild(d); }
  const kinds = { user: "msg user", assistant: "msg", thinking: "msg notice", tool: "tool", notice: "msg notice", error: "msg err" };
  d.className = kinds[e.kind] || "msg";
  if (e.kind === "tool") {
    d.textContent = "⏺ " + e.tool + " " + (e.args || "");
    if (e.text) {
      const r = document.createElement("div"); r.className = "res" + (e.isError ? " err" : ""); r.textContent = e.text; d.appendChild(r);
    }
  } else if (e.kind === "user") d.textContent = "› " + e.text;
  else if (e.kind === "error") d.textContent = "error: " + e.text;
  else d.textContent = e.text;
  log.scrollTop = log.scrollHeight;
}

function showDialog(d) {
  dialog = d;
  document.querySelectorAll(".dialog").forEach((n) => n.remove());
  if (!d) return;
  const box = document.createElement("div"); box.className = "msg dialog";
  const h = document.createElement("div"); h.className = "user"; h.textContent = d.title + (d.message ? " — " + d.message : "");
  box.appendChild(h);
  const done = (value, yes) => { api.Answer(value, yes); };
  if (d.method === "select") {
    d.options.forEach((o) => { const b = document.createElement("button"); b.textContent = o; b.onclick = () => done(o, false); box.appendChild(b); });
  } else if (d.method === "confirm") {
    [["Yes", true], ["No", false]].forEach(([l, y]) => { const b = document.createElement("button"); b.textContent = l; b.onclick = () => done("", y); box.appendChild(b); });
  } else {
    const i = document.createElement("input"); i.value = d.prefill || ""; i.placeholder = d.placeholder || ""; box.appendChild(i);
    const b = document.createElement("button"); b.textContent = "OK"; b.onclick = () => done(i.value, false); box.appendChild(b);
  }
  const c = document.createElement("button"); c.className = "stop"; c.textContent = "Cancel"; c.onclick = () => api.Dismiss(); box.appendChild(c);
  log.appendChild(box); log.scrollTop = log.scrollHeight;
}

function onUpdate(u) {
  (u.changes || []).forEach((c) => draw(c.index, c.entry));
  setBusy(u.busy);
  if (u.title) document.title = u.title;
  if (u.editor) { t.value = u.editor; t.focus(); }
  const st = $("status"); st.replaceChildren();
  if (u.status) { const li = document.createElement("li"); li.textContent = u.status; st.appendChild(li); }
  Object.values(u.widgets || {}).forEach((lines) => lines.forEach((l) => { const li = document.createElement("li"); li.textContent = l; st.appendChild(li); }));
  if ((u.dialog && u.dialog.id) !== (dialog && dialog.id)) showDialog(u.dialog);
}

async function refresh() {
  const i = await api.Info();
  $("cwd").textContent = (i.model ? i.model + " · " : "") + i.cwd;
  const ul = $("commands"); ul.replaceChildren();
  (i.commands || []).forEach((c) => {
    const li = document.createElement("li"); li.textContent = "/" + c.name; li.className = "cmd"; li.title = c.description || "";
    li.onclick = () => { t.value = "/" + c.name + " "; t.focus(); };
    ul.appendChild(li);
  });
}

function send() { const v = t.value.trim(); if (!v) return; t.value = ""; api.Send(v); }
$("f").addEventListener("submit", (ev) => { ev.preventDefault(); busy ? api.Cancel() : send(); });
t.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); send(); } });

Events.On("koine:update", (ev) => onUpdate(ev.data));
setTimeout(refresh, 500); // the agent process finishes starting asynchronously
</script>
</body>
</html>
