# One grouped pull request per ecosystem and cadence instead of one per dependency.
# Security updates are separate (GitHub raises them on their own) and are not delayed by the cooldown.
version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/tui-bubbletea", "/desktop"]
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      go-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
