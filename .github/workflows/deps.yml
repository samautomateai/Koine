name: dependency-updates

# Keeps pinned versions (Go toolchain, golangci-lint, govulncheck, Biome, action refs) and modules current.
# Weekly: opens a PR with `task deps:update`. Manual runs do the same. Dependabot still raises security PRs.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - name: Report outdated
        run: node scripts/deps.mjs check || true
      - name: Update
        run: |
          node scripts/deps.mjs update
          for d in . tui-bubbletea desktop; do (cd "$d" && go get -u ./... && go mod tidy); done
          npm update --save
          npm run -s format
      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/deps-update
          title: "chore(deps): update pinned versions and modules"
          commit-message: "chore(deps): update pinned versions and modules"
          body: |
            Automated by `.github/workflows/deps.yml` (`task deps:update`). CI must pass before merge.

            Docs-Impact: none (dependency versions only)
          labels: dependencies
