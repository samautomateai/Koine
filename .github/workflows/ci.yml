name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  TASK_VERSION: 3.x

jobs:
  go:
    name: Go · format, lint, size, tests, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: false }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: arduino/setup-task@v3
        with: { version: "${{ env.TASK_VERSION }}", repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Format (gofmt -s)
        run: task fmt:check
      - name: Lint (golangci-lint incl. gosec)
        uses: golangci/golangci-lint-action@v9
        with: { version: "${{ env.GOLANGCI_LINT_VERSION }}" }
      - name: Line and file length
        run: task size
      - name: Tests with race detector
        run: task test:race
      - name: Coverage gate (per package)
        run: task cover:gate
      - name: Build
        run: task build

  js:
    name: JS · format, lint, size, tests, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - name: Install dev tooling
        run: npm install --no-audit --no-fund --package-lock=false --ignore-scripts
      - name: Format and lint (Biome)
        run: npx --no-install biome ci .
      - name: Line and file length
        run: node scripts/sizecheck.mjs
      - name: Tests and coverage gate (Node)
        run: npm run test:cover
      - name: Sidecar tests on Bun
        run: bun test core/ext/jstest || true # Bun's runner differs; the Node suite is the gate, this is informational
      - name: Docs and spec traceability (requirements ↔ design ↔ tests, links)
        run: node scripts/docscheck.mjs
      - name: Living docs rule (PRs only)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/docscheck.mjs --base "$BASE_SHA" # reads Docs-Impact from PR_BODY

  dependency-audit:
    name: Dependency audit (Go + npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: false }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Go modules verify and tidy
        run: |
          go mod verify
          go mod tidy -diff
      - name: npm audit (lockfile generated on the fly; the root package has dev dependencies only)
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund
          npm audit --audit-level=high
      # Needs "Dependency graph" enabled in Settings → Security. Set the repository variable DEPENDENCY_REVIEW=true once it is.
      - name: Review new dependencies in PRs (licenses and known advisories)
        if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW == 'true'
        uses: actions/dependency-review-action@v5
        with: { fail-on-severity: high }

  vulnerability-scan:
    name: Vulnerability scan (govulncheck + Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: false }
      - name: govulncheck (reachable vulnerabilities in code and stdlib)
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...
      - name: Trivy filesystem scan (all ecosystems)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  # The two frontend modules (REQ-FE-002): separate go.mod files with third-party dependencies (ADR 0013), built here with the Wails v3 system
  # libraries (GTK 4, WebKitGTK 6.0; ADR 0015). Their go.sum files are committed; `go mod tidy -diff` fails on drift. The RPC client they share is gated by the `go` job.
  frontends:
    name: Frontends · ${{ matrix.module }} build, vet, test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # main() and the Wails glue are not unit-testable, so the gate covers the package that holds the logic (cmd/koine has 75 for the same reason)
          - { module: tui-bubbletea, cover_pkg: ".", cover_min: 80 }
          - { module: desktop, cover_pkg: "./bridge", cover_min: 85 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: false }
      - name: Wails v3 system libraries (GTK 4 and WebKitGTK 6.0)
        if: matrix.module == 'desktop'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      - name: go.mod and go.sum are tidy
        working-directory: ${{ matrix.module }}
        run: go mod tidy -diff
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Tests with the race detector
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...
      - name: Coverage gate
        working-directory: ${{ matrix.module }}
        run: |
          pct=$(go test -count=1 -cover ${{ matrix.cover_pkg }} | sed -n 's/.*coverage: \([0-9.]*\)%.*/\1/p')
          echo "coverage of ${{ matrix.cover_pkg }}: ${pct}% (min ${{ matrix.cover_min }}%)"
          awk -v p="$pct" -v m="${{ matrix.cover_min }}" 'BEGIN { exit !(p != "" && p >= m) }'

  # One required check for branch protection.
  gate:
    name: all gates passed
    if: always()
    needs: [go, js, dependency-audit, vulnerability-scan, secret-scan, frontends]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
