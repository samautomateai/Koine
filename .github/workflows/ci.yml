name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.5.0
  GOVULNCHECK_VERSION: v1.1.4
  TASK_VERSION: 3.x

jobs:
  go:
    name: Go · format, lint, size, tests, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: arduino/setup-task@v2
        with: { version: "${{ env.TASK_VERSION }}", repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Format (gofmt -s)
        run: task fmt:check
      - name: Lint (golangci-lint incl. gosec)
        uses: golangci/golangci-lint-action@v8
        with: { version: "${{ env.GOLANGCI_LINT_VERSION }}" }
      - name: Line and file length
        run: task size
      - name: Tests with race detector
        run: task test:race
      - name: Coverage gate (per package)
        run: task cover:gate
      - name: Build
        run: task build

  js:
    name: JS · format, lint, size, tests, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - name: Install dev tooling
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Format (prettier)
        run: npm run format:check
      - name: Lint (eslint)
        run: npm run lint
      - name: Line and file length
        run: node scripts/sizecheck.mjs
      - name: Tests and coverage gate (Node)
        run: npm run test:cover
      - name: Sidecar tests on Bun
        run: bun test core/ext/jstest || true # Bun's runner differs; the Node suite is the gate, this is informational
      - name: Docs and spec traceability (requirements ↔ design ↔ tests, links)
        run: node scripts/docscheck.mjs
      - name: Living docs rule (PRs only)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if printf '%s' "$PR_BODY" | grep -qiE '^Docs-Impact:[[:space:]]*none'; then export DOCS_IMPACT_NONE=1; fi
          node scripts/docscheck.mjs --base "$BASE_SHA"

  dependency-audit:
    name: Dependency audit (Go + npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Go modules verify and tidy
        run: |
          go mod verify
          go mod tidy -diff
      - name: npm audit (lockfile generated on the fly; the root package has dev dependencies only)
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund
          npm audit --audit-level=high
      - name: Review new dependencies in PRs (licenses and known advisories)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with: { fail-on-severity: high }

  vulnerability-scan:
    name: Vulnerability scan (govulncheck + Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: govulncheck (reachable vulnerabilities in code and stdlib)
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...
      - name: Trivy filesystem scan (all ecosystems)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  # One required check for branch protection.
  gate:
    name: all gates passed
    if: always()
    needs: [go, js, dependency-audit, vulnerability-scan, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
